<body>
    <header>
        <div class="header-left">
            <div class="logo">
                <a href="index.html">
                    <h1>PASQUALE CARANGELO</h1>
                    <span class="subtitle" data-i18n="subtitle">Photographer</span>
                </a>
            </div>
        </div>
        <div class="header-right">
            <div class="lang-switcher">
                <span class="lang-btn active" data-lang="IT">IT</span>
                <span class="lang-divider">|</span>
                <span class="lang-btn" data-lang="EN">EN</span>
            </div>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <nav class="menu-overlay" id="menuOverlay">
        <div class="menu-close" id="menuClose">&#10005;</div>
        <ul>

    </nav>

    <main class="page-content">
        <div class="contact-wrapper">
            <h2 class="contact-title" data-i18n="contact-title">Contacts</h2>

            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label data-i18n="form-name" for="formName">Name</label>
                    <input type="text" id="formName" name="name" required>
                </div>
                <div class="form-group">
                    <label data-i18n="form-email" for="formEmail">Email</label>
                    <input type="email" id="formEmail" name="email" required>
                </div>
                <div class="form-group">
                    <label data-i18n="form-message" for="formMessage">Message</label>
                    <textarea id="formMessage" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn" data-i18n="form-send">Send</button>
                <div class="form-feedback" id="formFeedback"></div>
            </form>

            <div class="social-section">
                <h3 data-i18n="form-follow">Follow Me</h3>
                <div class="social-links">
                    <a href="https://www.instagram.com/pasqualecarangelo/" target="_blank" rel="noopener" class="social-icon" aria-label="Instagram">
